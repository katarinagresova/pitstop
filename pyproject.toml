[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "pitstop"
dynamic = ["version"]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pysam>=0.22"]

[project.scripts]
pitstop = "pitstop.cli:main"

[project.optional-dependencies]
docs = ["zensical; python_version >= '3.11'"]  # zensical needs Python 3.11+

[tool.setuptools.dynamic]
version = {attr = "pitstop.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
